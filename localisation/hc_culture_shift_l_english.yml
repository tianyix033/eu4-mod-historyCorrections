l_english:
 hc_culture_shift.1.t:0 "The Kazakh Khanate"
 hc_culture_shift.1.d:0 "The ulus we rule is Kazakh now - in its speech, in its pastures, in the names its people give their children. What remains of the following our fathers led out of the north would not fill a single camp. Whatever we choose to call ourselves, our grandsons will be reckoned Kazakh."
 hc_culture_shift.1.a:0 "Then let the name follow the people."
 hc_culture_shift.1.b:0 "We will not give up the name of our fathers."
 hc_culture_shift.2.t:0 "The Khalkha Banner"
 hc_culture_shift.2.d:0 "We have been driven back into the country the Khalkha have always held, and we find we are not diminished by it so much as revealed. The camps that still ride with us are Khalkha camps. The old claim to rule all the Mongols has become a story we tell ourselves in winter."
 hc_culture_shift.2.a:0 "We are Khalkha, and that is no small thing."
 hc_culture_shift.2.b:0 "The Great Khan's inheritance is not surrendered so easily."
 hc_culture_shift.3.t:0 "Masters of the Oases"
 hc_culture_shift.3.d:0 "Our riders no longer winter on the steppe. We hold the oases now - their canals, their caravans, their crowded towns - and it is the Uyghur who fill our treasury, our garrisons and increasingly our court. A horde that lives off the Tarim eventually belongs to it."
 hc_culture_shift.3.a:0 "We are a people of the oases now."
 hc_culture_shift.3.b:0 "We remain of the steppe, whatever we have conquered."
 hc_culture_shift.4.t:0 "Patrons of the Faith"
 hc_culture_shift.4.d:0 "We came as protectors of the lamas and stayed as their neighbours. The grasslands that bred us have passed to other hands, and what we hold is Tibet - its monasteries, its valleys, its quarrels. Our sons are being raised by Tibetan tutors and pray in Tibetan."
 hc_culture_shift.4.a:0 "Our place is here now."
 hc_culture_shift.4.b:0 "We have not forgotten the country we came from."
