l_english:
 hc_form_kazakh_title:0 "Proclaim the Kazakh Khanate"
 hc_form_kazakh_desc:0 "Our herds graze the steppe between the Syr Darya and the Irtysh, and our people call themselves Kazakh. The old allegiances have dissolved. Let the tag match the tribe."
 hc_form_khalkha_title:0 "Proclaim the Khalkha"
 hc_form_khalkha_desc:0 "What remains of us is Khalkha, and only Khalkha. The banners of the wider empire answer to other khans now. Let us be what we have become."
 hc_form_zunghar_title:0 "Proclaim the Zunghar Khanate"
 hc_form_zunghar_desc:0 "Our khans still ride, but the tongue of the court and the caravan is now that of the oasis cities. We rule the Tarim as the Dzungars did, and the name should follow the fact."
 hc_form_khoshuud_title:0 "Proclaim the Khoshuud Khanate"
 hc_form_khoshuud_desc:0 "From Tsaidam we hold the roads into Tibet, and the faith and speech of that land have become our own. Gushri Khan's people were Khoshuud in name and Tibetan in life; so are we."
