l_english:
 KZH_ideas:0 "Kazakh Ideas"
 KZH_ideas_start:0 "Kazakh Traditions"
 KZH_ideas_bonus:0 "Kazakh Ambition"
 kzh_three_juz:0 "The Three Juz"
 kzh_three_juz_desc:0 "The khanate was never one people under one hand. The Senior, Middle and Junior Juz kept their own pastures, their own elders and their own quarrels, and answered a khan when it suited them. It cost the Kazakhs unity and gave them something more useful: there was no single camp an enemy could burn to end the war."
 kzh_qasym_bright_path:0 "The Bright Path"
 kzh_qasym_bright_path_desc:0 "Qasym Khan set down what the steppe had always known but never written - how a dispute is judged, what a killing is worth, who owes what to whom. The Kazakhs called it the Bright Path, and it outlived the khan who gave it."
 kzh_jeti_jarghy:0 "The Seven Charters"
 kzh_jeti_jarghy_desc:0 "Tauke Khan gathered the biys of all three juz and had them agree the Seven Charters: the law of blood money, of theft, of marriage and of the assembly. A code the tribes had written themselves was a code they would keep."
 kzh_steppe_horsemen:0 "Riders of the Great Steppe"
 kzh_steppe_horsemen_desc:0 "A Kazakh boy rides before he walks well, and a Kazakh household counts its wealth in horses. We do not raise cavalry. We simply have it."
 kzh_caravan_roads:0 "The Caravan Roads"
 kzh_caravan_roads_desc:0 "Our pastures sit astride the roads between Russia, Bukhara and the Qing. Caravans that wish to cross the steppe pay us to cross it safely, and those that do not pay cross it once."
 kzh_winter_pastures:0 "Jailau and Qystau"
 kzh_winter_pastures_desc:0 "The jailau in summer, the qystau in winter, and the knowledge of which wells hold through a hard year. An army that does not know the steppe does not cross the steppe, whatever its numbers."
 kzh_years_of_distress:0 "The Years of Great Distress"
 kzh_years_of_distress_desc:0 "The Zunghars came in 1723 and the people fled barefoot - Aqtaban Shubyryndy, the Years of Great Distress. Whole auls were lost. The khanate did not end, and everyone who survived it knew exactly what it had cost."
 ZUN_ideas:0 "Zunghar Ideas"
 ZUN_ideas_start:0 "Zunghar Traditions"
 ZUN_ideas_bonus:0 "Zunghar Ambition"
 zun_renats_foundry:0 "Renat's Foundry"
 zun_renats_foundry_desc:0 "Johan Gustaf Renat was taken by the Russians at Poltava, marched to Siberia, and taken again by us. He stayed seventeen years and left behind cannon, mortars and men who knew how to cast them. No other steppe power troubled to learn."
 zun_zamburak:0 "The Camel Guns"
 zun_zamburak_desc:0 "A swivel gun mounted on the saddle of a kneeling camel. It is not accurate and it is not quick, but it arrives where no gun carriage can follow, and horses that have never heard one do not stay in line."
 zun_tarim_oases:0 "Masters of the Tarim"
 zun_tarim_oases_desc:0 "Kashgar, Yarkand, Khotan - walled towns with canals, weavers and tax rolls. A horde that collects from oases rather than from herds can pay for things a horde cannot."
 zun_great_code:0 "The Great Code of the Steppe"
 zun_great_code_desc:0 "In 1640 the Oirat princes met and agreed a common law binding all of them, with the lamas as witness. It settled precedence, pasture and the obligation to ride when called, and for a century it held."
 zun_mines_and_foundries:0 "Mines and Foundries"
 zun_mines_and_foundries_desc:0 "Iron and copper from the Ili valley, smelted at home, worked at home. We sow grain where our grandfathers only grazed, and we do not ask anyone's permission to arm ourselves."
 zun_yellow_church:0 "Patrons of the Yellow Church"
 zun_yellow_church_desc:0 "We are patrons of the Gelug, and no one is seated in Lhasa without our word on it. Piety and leverage are not always separable, and we have never pretended otherwise."
 zun_the_last_horde:0 "The Last Horde"
 zun_the_last_horde_desc:0 "Every other steppe power has been broken, bought or settled. We are what remains of the world before the walls and the guns, and we have made ourselves guns of our own."
